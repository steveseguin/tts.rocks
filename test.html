<!DOCTYPE html>
<html>
<head>
    <title>TTS.js Test Page</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 800px; margin: 50px auto; padding: 20px; }
        .test-section { margin: 20px 0; padding: 20px; border: 1px solid #ddd; border-radius: 8px; }
        button { margin: 5px; padding: 10px 20px; cursor: pointer; }
        textarea { width: 100%; min-height: 100px; margin: 10px 0; }
        .status { margin-top: 10px; padding: 10px; background: #f0f0f0; border-radius: 4px; }
    </style>
</head>
<body>
    <h1>TTS.js Integration Test</h1>
    
    <div class="test-section">
        <h2>Quick Test</h2>
        <textarea id="testText">Hello! This is a test of the text-to-speech system.</textarea>
        <br>
        <button onclick="testBrowser()">Test Browser TTS</button>
        <button onclick="testKokoro()">Test Kokoro</button>
        <button onclick="testPiper()">Test Piper</button>
        <button onclick="testEspeak()">Test eSpeak</button>
        <div id="status" class="status"></div>
    </div>

    <script src="tts.js"></script>
    <script>
        function setStatus(msg) {
            document.getElementById('status').innerHTML = msg;
        }

        function testBrowser() {
            const text = document.getElementById('testText').value;
            setStatus('Testing Browser TTS...');
            
            if (window.TTS) {
                window.TTS.TTSProvider = 'browser';
                window.TTS.speak(text, true);
                setStatus('Browser TTS activated - should hear speech');
            } else {
                setStatus('TTS.js not loaded!');
            }
        }

        async function testKokoro() {
            const text = document.getElementById('testText').value;
            setStatus('Initializing Kokoro...');
            
            if (window.TTS) {
                window.TTS.TTSProvider = 'kokoro';
                await window.TTS.initKokoro();
                window.TTS.speak(text, true);
                setStatus('Kokoro TTS activated - loading model...');
            } else {
                setStatus('TTS.js not loaded!');
            }
        }

        async function testPiper() {
            const text = document.getElementById('testText').value;
            setStatus('Initializing Piper...');
            
            if (window.TTS) {
                window.TTS.TTSProvider = 'piper';
                await window.TTS.initPiper();
                window.TTS.speak(text, true);
                setStatus('Piper TTS activated');
            } else {
                setStatus('TTS.js not loaded!');
            }
        }

        async function testEspeak() {
            const text = document.getElementById('testText').value;
            setStatus('Initializing eSpeak...');
            
            if (window.TTS) {
                window.TTS.TTSProvider = 'espeak';
                await window.TTS.initEspeak();
                window.TTS.speak(text, true);
                setStatus('eSpeak TTS activated');
            } else {
                setStatus('TTS.js not loaded!');
            }
        }

        // Check if TTS.js loaded
        window.addEventListener('load', () => {
            if (window.TTS) {
                setStatus('TTS.js loaded successfully! Ready to test.');
            } else {
                setStatus('Error: TTS.js failed to load');
            }
        });
    </script>
</body>
</html>
