<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCI+PHBhdGggZmlsbD0iIzY0NmNmZiIgZD0iTTEyIDJDOS43OSAyIDggMy43OSA4IDZ2NmMwIDIuMjEgMS43OSA0IDQgNHM0LTEuNzkgNC00VjZjMC0yLjIxLTEuNzktNC00LTR6Ii8+PHBhdGggZmlsbD0iIzY0NmNmZiIgZD0iTTEyIDJDOS43OSAyIDggMy43OSA4IDZ2NmMwIDIuMjEgMS43OSA0IDQgNHM0LTEuNzkgNC00VjZjMC0yLjIxLTEuNzktNC00LTR6TTcgMTFjMCAyLjc2LTIuMjQgNS01IDVzLTUtMi4yNC01LTVINWMwIDMuNTMgMi42MSA2LjQzIDYgNi45MlYyMWgydi0zLjA4YzMuMzktLjQ5IDYtMy4zOSA2LTYuOTJoLTJ6Ii8+PC9zdmc+" type="image/svg+xml">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TTS.Rocks - Universal AI Text to Speech</title>
    
    <meta name="description" content="Free multilingual AI text-to-speech with 10+ engines. Kokoro, Piper, ElevenLabs, OpenAI, Google Cloud & more. Browser-based with Chrome AI integration.">
    <meta name="keywords" content="text to speech, TTS, WebGPU, Kokoro, Piper, ElevenLabs, OpenAI, browser TTS, offline speech synthesis, AI voice generator">
    
    <meta property="og:title" content="TTS.Rocks - Universal AI Text to Speech">
    <meta property="og:description" content="Free multilingual AI text-to-speech with 10+ engines. Browser-based with Chrome AI integration.">
    <meta property="og:url" content="https://tts.rocks">
    
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="TTS.Rocks - Universal AI Text to Speech">
    <meta name="twitter:description" content="Free multilingual AI text-to-speech with 10+ engines.">
    
    <meta name="theme-color" content="#646cff">
    <link rel="canonical" href="https://tts.rocks">
    
    <style>
        :root {
            --bg-primary: #1a1a1a;
            --bg-secondary: #2d2d2d;
            --bg-tertiary: #242424;
            --text-primary: #ffffff;
            --text-secondary: #b3b3b3;
            --text-muted: #808080;
            --accent: #646cff;
            --accent-hover: #747bff;
            --border: #3f3f3f;
            --success: #4caf50;
            --warning: #ff9800;
            --error: #f44336;
            --info: #2196f3;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, system-ui, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, var(--accent), var(--accent-hover));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 1.1rem;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr;
            gap: 2rem;
        }

        .card {
            background: var(--bg-secondary);
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .card-title {
            font-size: 1.2rem;
            font-weight: 500;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .card-title svg {
            width: 20px;
            height: 20px;
            fill: var(--accent);
        }

        .text-input-section {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .text-tools {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .text-tools button {
            padding: 0.4rem 0.8rem;
            font-size: 0.85rem;
        }

        textarea {
            width: 100%;
            background: var(--bg-tertiary);
            color: var(--text-primary);
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
            padding: 1rem;
            min-height: 150px;
            resize: vertical;
            font-family: inherit;
        }

        textarea:focus {
            border-color: var(--accent);
            outline: none;
        }

        .character-count {
            text-align: right;
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        .voice-settings {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        label {
            color: var(--text-secondary);
            font-size: 0.9rem;
            font-weight: 500;
        }

        select, input[type="text"], input[type="password"], input[type="number"] {
            background: var(--bg-tertiary);
            color: var(--text-primary);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 0.6rem;
            font-size: 0.9rem;
        }

        select:focus, input:focus {
            border-color: var(--accent);
            outline: none;
        }

        button {
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 6px;
            padding: 0.6rem 1.2rem;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        button:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
        }

        button:disabled {
            background: var(--border);
            cursor: not-allowed;
            transform: none;
            opacity: 0.6;
        }

        button.secondary {
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
        }

        button.secondary:hover {
            background: var(--bg-primary);
            border-color: var(--accent);
        }

        .range-container {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        input[type="range"] {
            flex: 1;
            -webkit-appearance: none;
            background: var(--border);
            border-radius: 8px;
            height: 6px;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            background: var(--accent);
            border-radius: 50%;
            height: 18px;
            width: 18px;
            cursor: pointer;
        }

        .range-value {
            min-width: 3rem;
            text-align: right;
            color: var(--accent);
            font-weight: 500;
        }

        .action-buttons {
            display: flex;
            gap: 1rem;
            margin-top: 1.5rem;
        }

        .action-buttons button {
            flex: 1;
        }

        .api-key-section {
            background: var(--bg-tertiary);
            border-radius: 8px;
            padding: 1rem;
            margin-top: 1rem;
        }

        .api-key-hint {
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-top: 0.25rem;
        }

        .audio-player {
            margin-top: 2rem;
        }

        audio {
            width: 100%;
            margin-top: 1rem;
        }

        .status-message {
            padding: 1rem;
            border-radius: 6px;
            margin-top: 1rem;
            display: none;
        }

        .status-message.info {
            background: rgba(33, 150, 243, 0.1);
            border: 1px solid var(--info);
            color: var(--info);
        }

        .status-message.success {
            background: rgba(76, 175, 80, 0.1);
            border: 1px solid var(--success);
            color: var(--success);
        }

        .status-message.error {
            background: rgba(244, 67, 54, 0.1);
            border: 1px solid var(--error);
            color: var(--error);
        }

        .status-message.warning {
            background: rgba(255, 152, 0, 0.1);
            border: 1px solid var(--warning);
            color: var(--warning);
        }

        .ai-tools-section {
            background: linear-gradient(135deg, rgba(100, 108, 255, 0.1), rgba(116, 123, 255, 0.05));
            border: 1px solid var(--accent);
            border-radius: 8px;
            padding: 1rem;
            margin-top: 1rem;
        }

        .ai-tools-title {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 0.5rem;
        }

        .ai-badge {
            background: var(--accent);
            color: white;
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .tabs {
            display: flex;
            gap: 0.5rem;
            border-bottom: 2px solid var(--border);
            margin-bottom: 1.5rem;
        }

        .tab {
            padding: 0.75rem 1.5rem;
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
        }

        .tab:hover {
            color: var(--text-primary);
        }

        .tab.active {
            color: var(--accent);
            border-bottom-color: var(--accent);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .loading-spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        footer {
            margin-top: 3rem;
            text-align: center;
            color: var(--text-muted);
            padding: 2rem 0;
            border-top: 1px solid var(--border);
        }

        footer a {
            color: var(--accent);
            text-decoration: none;
        }

        footer a:hover {
            text-decoration: underline;
        }

        @media (max-width: 768px) {
            .container {
                padding: 1rem;
            }
            
            h1 {
                font-size: 2rem;
            }
            
            .voice-settings {
                grid-template-columns: 1fr;
            }
        }

        .progress-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .progress-modal {
            background: var(--bg-secondary);
            border-radius: 12px;
            padding: 2rem;
            max-width: 400px;
            width: 90%;
        }

        .progress-bar {
            background: var(--border);
            border-radius: 6px;
            height: 8px;
            overflow: hidden;
            margin: 1rem 0;
        }

        .progress-fill {
            background: var(--accent);
            height: 100%;
            transition: width 0.3s ease;
        }

        .progress-text {
            text-align: center;
            color: var(--text-secondary);
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎙️ TTS.Rocks</h1>
            <p class="subtitle">Universal AI Text-to-Speech with 10+ Engines</p>
        </header>

        <div class="main-content">
            <!-- Text Input Section -->
            <div class="card">
                <div class="card-title">
                    <svg viewBox="0 0 24 24"><path d="M14,17H7V15H14M17,13H7V11H17M17,9H7V7H17M19,3H5C3.89,3 3,3.89 3,5V19A2,2 0 0,0 5,21H19A2,2 0 0,0 21,19V5C21,3.89 20.1,3 19,3Z"/></svg>
                    Text Input
                </div>
                
                <div class="text-input-section">
                    <div class="text-tools">
                        <button class="secondary" id="clearBtn">Clear</button>
                        <button class="secondary" id="summarizeBtn" style="display:none">
                            <span class="ai-badge">AI</span> Summarize
                        </button>
                        <button class="secondary" id="detectLangBtn" style="display:none">
                            <span class="ai-badge">AI</span> Detect Language
                        </button>
                        <button class="secondary" id="improveBtn" style="display:none">
                            <span class="ai-badge">AI</span> Improve Text
                        </button>
                    </div>
                    
                    <textarea id="textInput" placeholder="Enter text to convert to speech..."></textarea>
                    <div class="character-count">
                        <span id="charCount">0</span> / <span id="charLimit">5000</span> characters
                    </div>
                </div>
            </div>

            <!-- Voice Settings -->
            <div class="card">
                <div class="card-title">
                    <svg viewBox="0 0 24 24"><path d="M12,15.5A3.5,3.5 0 0,1 8.5,12A3.5,3.5 0 0,1 12,8.5A3.5,3.5 0 0,1 15.5,12A3.5,3.5 0 0,1 12,15.5M19.43,12.97C19.47,12.65 19.5,12.33 19.5,12C19.5,11.67 19.47,11.34 19.43,11L21.54,9.37C21.73,9.22 21.78,8.95 21.66,8.73L19.66,5.27C19.54,5.05 19.27,4.96 19.05,5.05L16.56,6.05C16.04,5.66 15.5,5.32 14.87,5.07L14.5,2.42C14.46,2.18 14.25,2 14,2H10C9.75,2 9.54,2.18 9.5,2.42L9.13,5.07C8.5,5.32 7.96,5.66 7.44,6.05L4.95,5.05C4.73,4.96 4.46,5.05 4.34,5.27L2.34,8.73C2.21,8.95 2.27,9.22 2.46,9.37L4.57,11C4.53,11.34 4.5,11.67 4.5,12C4.5,12.33 4.53,12.65 4.57,12.97L2.46,14.63C2.27,14.78 2.21,15.05 2.34,15.27L4.34,18.73C4.46,18.95 4.73,19.03 4.95,18.95L7.44,17.94C7.96,18.34 8.5,18.68 9.13,18.93L9.5,21.58C9.54,21.82 9.75,22 10,22H14C14.25,22 14.46,21.82 14.5,21.58L14.87,18.93C15.5,18.67 16.04,18.34 16.56,17.94L19.05,18.95C19.27,19.03 19.54,18.95 19.66,18.73L21.66,15.27C21.78,15.05 21.73,14.78 21.54,14.63L19.43,12.97Z"/></svg>
                    Voice Settings
                </div>

                <div class="tabs">
                    <button class="tab active" data-tab="engine">Engine</button>
                    <button class="tab" data-tab="voice">Voice</button>
                    <button class="tab" data-tab="advanced">Advanced</button>
                </div>

                <div class="tab-content active" id="engine-tab">
                    <div class="voice-settings">
                        <div class="form-group">
                            <label for="engineSelect">TTS Engine</label>
                            <select id="engineSelect">
                                <option value="kokoro">Kokoro (Local, High Quality)</option>
                                <option value="piper">Piper (Local, Fast)</option>
                                <option value="espeak">eSpeak (Local, Lightweight)</option>
                                <option value="kitten">Kitten (Local, Tiny)</option>
                                <option value="browser">Browser Native</option>
                                <option value="elevenlabs">ElevenLabs (API)</option>
                                <option value="openai">OpenAI (API)</option>
                                <option value="google">Google Cloud (API)</option>
                            </select>
                        </div>

                        <div class="form-group" id="apiKeySection" style="display:none">
                            <label for="apiKeyInput">API Key</label>
                            <input type="password" id="apiKeyInput" placeholder="Enter API key">
                            <div class="api-key-hint">API key is stored locally and never sent to our servers</div>
                        </div>
                    </div>
                </div>

                <div class="tab-content" id="voice-tab">
                    <div class="voice-settings">
                        <div class="form-group">
                            <label for="voiceSelect">Voice</label>
                            <select id="voiceSelect">
                                <option value="">Select a voice...</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="languageSelect">Language</label>
                            <select id="languageSelect">
                                <option value="en-US">English (US)</option>
                                <option value="en-GB">English (UK)</option>
                                <option value="es-ES">Spanish</option>
                                <option value="fr-FR">French</option>
                                <option value="de-DE">German</option>
                                <option value="it-IT">Italian</option>
                                <option value="pt-BR">Portuguese (Brazil)</option>
                                <option value="ru-RU">Russian</option>
                                <option value="zh-CN">Chinese (Simplified)</option>
                                <option value="ja-JP">Japanese</option>
                                <option value="ko-KR">Korean</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="tab-content" id="advanced-tab">
                    <div class="voice-settings">
                        <div class="form-group">
                            <label for="speedSlider">Speed</label>
                            <div class="range-container">
                                <input type="range" id="speedSlider" min="0.5" max="2" step="0.1" value="1">
                                <span class="range-value" id="speedValue">1.0x</span>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="pitchSlider">Pitch</label>
                            <div class="range-container">
                                <input type="range" id="pitchSlider" min="0.5" max="2" step="0.1" value="1">
                                <span class="range-value" id="pitchValue">1.0</span>
                            </div>
                        </div>

                        <div class="form-group" id="stabilityGroup" style="display:none">
                            <label for="stabilitySlider">Stability (ElevenLabs)</label>
                            <div class="range-container">
                                <input type="range" id="stabilitySlider" min="0" max="1" step="0.1" value="0.5">
                                <span class="range-value" id="stabilityValue">0.5</span>
                            </div>
                        </div>

                        <div class="form-group" id="similarityGroup" style="display:none">
                            <label for="similaritySlider">Similarity (ElevenLabs)</label>
                            <div class="range-container">
                                <input type="range" id="similaritySlider" min="0" max="1" step="0.1" value="0.75">
                                <span class="range-value" id="similarityValue">0.75</span>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="action-buttons">
                    <button id="generateBtn">
                        <svg style="width:16px;height:16px;vertical-align:middle;margin-right:4px" viewBox="0 0 24 24">
                            <path fill="currentColor" d="M8,5.14V19.14L19,12.14L8,5.14Z"/>
                        </svg>
                        Generate Speech
                    </button>
                    <button id="downloadBtn" class="secondary" disabled>
                        <svg style="width:16px;height:16px;vertical-align:middle;margin-right:4px" viewBox="0 0 24 24">
                            <path fill="currentColor" d="M5,20H19V18H5M19,9H15V3H9V9H5L12,16L19,9Z"/>
                        </svg>
                        Download Audio
                    </button>
                    <button id="stopBtn" class="secondary" style="display:none">
                        <svg style="width:16px;height:16px;vertical-align:middle;margin-right:4px" viewBox="0 0 24 24">
                            <path fill="currentColor" d="M18,18H6V6H18V18Z"/>
                        </svg>
                        Stop
                    </button>
                </div>
            </div>

            <!-- Audio Player -->
            <div class="card audio-player" id="audioSection" style="display:none">
                <div class="card-title">
                    <svg viewBox="0 0 24 24"><path d="M14,3.23V5.29C16.89,6.15 19,8.83 19,12C19,15.17 16.89,17.84 14,18.7V20.77C18,19.86 21,16.28 21,12C21,7.72 18,4.14 14,3.23M16.5,12C16.5,10.23 15.5,8.71 14,7.97V16C15.5,15.29 16.5,13.76 16.5,12M3,9V15H7L12,20V4L7,9H3Z"/></svg>
                    Audio Output
                </div>
                <audio id="audioPlayer" controls></audio>
            </div>

            <!-- Status Messages -->
            <div id="statusMessage" class="status-message"></div>
        </div>

        <footer>
            <p>Built with ❤️ by <a href="https://github.com/steveseguin/tts-web" target="_blank">Steve Seguin</a></p>
            <p>Open source and free forever | <a href="https://github.com/steveseguin/tts-web" target="_blank">GitHub</a></p>
        </footer>
    </div>

    <!-- Progress Overlay -->
    <div class="progress-overlay" id="progressOverlay">
        <div class="progress-modal">
            <h3 style="margin-bottom: 1rem;">Loading Model</h3>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="progress-text" id="progressText">Initializing...</div>
        </div>
    </div>

    <!-- Include tts.js -->
    <script src="tts.js"></script>
    <!-- Main application script -->
    <script type="module" src="main-enhanced.js"></script>
</body>
</html>
